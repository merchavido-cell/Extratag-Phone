name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libssl-dev
        pip install --upgrade "buildozer<3.0.0" cython

    - name: Build APK with Buildozer
      run: |
        cd Phone
        export ANDROID_NDK_HOME=""
        export ANDROID_NDK_ROOT=""
        export ANDROID_NDK=""
        buildozer android debug
      env:
        ANDROID_NDK_HOME: ""
        ANDROID_NDK_ROOT: ""
        ANDROID_NDK: ""

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Extratag-Phone-APK
        path: Phone/bin/*.apk
